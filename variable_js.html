<html>
    <head>
        <title>Variable in JavaScript</title>
        <script>
            function variable() {
                var a = 10;
                var b = 20;
                var c = a + b;
                var d = b - a;
                var e = a * b;
                var f = b / a;
                alert("The sum of a = " +a+ " and b = " +b+ " is: " + c 
                + "\nThe difference of a = " +a+ " and b = " +b+ " is: " + d
                + "\nThe product of a = " +a+ " and b = " +b+ " is: " + e
                + "\nThe quotient of a = " +a+ " and b = " +b+ " is: " + f
                );
                const employee = {
                    name: "John Doe",
                    age: 30,
                    position: "Software Engineer"
                };
                document.getElementById("ide1").innerHTML = "Employee Name: " + employee.name + "<br>" +
                "Employee Age: " + employee.age + "<br>" +
                "Employee Position: " + employee.position;
            }
        </script>
    </head>
    <body>
        <button onclick="variable()">Click Here</button> <br>
        <br>
        <p id="ide1"></p>
    </body>

</html>
